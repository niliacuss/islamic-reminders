name: Send Islamic Reminder

on:
  schedule:
    # Elke 15 min op minuten 7, 22, 37, 52 (off-peak — vermijdt minuut 0
    # en de quarter-marks 15/30/45 die ook hoge belasting krijgen).
    # GitHub Actions skipt regelmatig hele cron-triggers tijdens piek;
    # daarom 4 kansen per uur, ~16-20 firings per slot-venster.
    # UTC 8-22 dekt alle Amsterdam slot-vensters in zowel CET als CEST:
    #   slot 0 (10-14u Ams)  → UTC 8-13 (zomer) / 9-13 (winter)
    #   slot 1 (15-19u Ams)  → UTC 13-17 (zomer) / 14-18 (winter)
    #   slot 2 (20-23u Ams)  → UTC 18-21 (zomer) / 19-22 (winter)
    # .last_sent.json dedupliceert: alleen de eerste succesvolle run per
    # slot stuurt daadwerkelijk; de rest exit cleanly binnen seconden.
    - cron: '7,22,37,52 8-22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: send-reminder
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir requests

      - name: Send reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python send_reminder.py

      - name: Commit state file
        run: |
          if [[ -z "$(git status --porcelain .last_sent.json)" ]]; then
            echo "No changes to .last_sent.json — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last_sent.json
          git commit -m "chore: update .last_sent.json [skip ci]"
          # Push with rebase-and-retry to handle the rare case where another
          # commit landed on main between fetch and push (e.g. user edits).
          # Without this the state file could fall behind and trigger a
          # duplicate send on the next cron.
          for attempt in 1 2 3; do
            if git push 2>&1; then
              echo "Pushed state on attempt $attempt."
              exit 0
            fi
            echo "Push failed on attempt $attempt; rebasing on remote..."
            git pull --rebase origin main || true
          done
          echo "WARNING: state file push failed after 3 attempts."
          exit 1
