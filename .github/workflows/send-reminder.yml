name: Send Islamic Reminder

on:
  # Primair pad: externe scheduler (cron-job.org) belt de GitHub API en
  # triggert dit event om 10:00, 15:00 en 20:00 Amsterdam. Cron-job.org
  # heeft een eigen reliable scheduler (~60s accuracy) die niet onder
  # GitHub Actions' load valt.
  repository_dispatch:
    types: [send-reminder]

  # Backup pad: GitHub's eigen cron blijft draaien als safety net voor
  # als cron-job.org zelf een keer uitvalt. .last_sent.json dedupliceert:
  # als cron-job.org al succesvol heeft verstuurd, exit GitHub's cron-run
  # binnen seconden zonder een tweede bericht te sturen.
  schedule:
    - cron: '7,22,37,52 8-22 * * *'

  # Handmatig pad: voor testen vanuit Actions UI. Zet FORCE_SEND=1 zodat
  # state-file en slot-window check overgeslagen worden.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: send-reminder
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir requests

      - name: Send reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_2: ${{ secrets.TELEGRAM_CHAT_ID_2 }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python send_reminder.py

      - name: Commit state file
        run: |
          if [[ -z "$(git status --porcelain .last_sent.json)" ]]; then
            echo "No changes to .last_sent.json — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last_sent.json
          git commit -m "chore: update .last_sent.json [skip ci]"
          # Push with rebase-and-retry to handle the rare case where another
          # commit landed on main between fetch and push (e.g. user edits).
          # Without this the state file could fall behind and trigger a
          # duplicate send on the next cron.
          for attempt in 1 2 3; do
            if git push 2>&1; then
              echo "Pushed state on attempt $attempt."
              exit 0
            fi
            echo "Push failed on attempt $attempt; rebasing on remote..."
            git pull --rebase origin main || true
          done
          echo "WARNING: state file push failed after 3 attempts."
          exit 1
